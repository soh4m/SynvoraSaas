<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flow-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Grid -->
  <g opacity="0.08">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="3 3"/>
    <circle cx="60" cy="60" r="30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="3 3"/>
  </g>
  <!-- Flow Lines -->
  <path d="M 20,60 C 40,20 80,100 100,60" stroke="url(#flow-glow)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow-filter)" />
  <path d="M 20,60 C 45,90 75,30 100,60" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Nodes -->
  <!-- Start node -->
  <circle cx="20" cy="60" r="5" fill="#0f0f12" stroke="#6366f1" stroke-width="2" />
  <circle cx="20" cy="60" r="1.5" fill="#6366f1" />
  
  <!-- Trigger point -->
  <circle cx="48" cy="46" r="6" fill="#0f0f12" stroke="#8b5cf6" stroke-width="2" />
  <polygon points="46,43 51,46 46,49" fill="#8b5cf6" />
  
  <!-- Logic gate -->
  <rect x="67" cy="67" width="10" height="10" rx="2" transform="rotate(45 72 72)" fill="#0f0f12" stroke="#6366f1" stroke-width="2" />
  <circle cx="72" cy="72" r="1.5" fill="#6366f1" />
  
  <!-- End node -->
  <circle cx="100" cy="60" r="5" fill="#0f0f12" stroke="#8b5cf6" stroke-width="2" />
  <circle cx="100" cy="60" r="2" fill="#8b5cf6" filter="url(#glow-filter)" />
</svg>
