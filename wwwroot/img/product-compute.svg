<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Grid -->
  <g opacity="0.1">
    <line x1="0" y1="20" x2="120" y2="20" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="0" y1="40" x2="120" y2="40" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="0" y1="60" x2="120" y2="60" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="0" y1="80" x2="120" y2="80" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="0" y1="100" x2="120" y2="100" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="20" y1="0" x2="20" y2="120" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="40" y1="0" x2="40" y2="120" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="60" y1="0" x2="60" y2="120" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="80" y1="0" x2="80" y2="120" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="100" y1="0" x2="100" y2="120" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
  </g>
  <!-- Server Chassis -->
  <rect x="20" y="25" width="80" height="18" rx="4" fill="#0f0f12" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
  <rect x="20" y="50" width="80" height="18" rx="4" fill="#0f0f12" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
  <rect x="20" y="75" width="80" height="18" rx="4" fill="#0f0f12" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
  <!-- Server details / glowing status lights -->
  <circle cx="28" cy="34" r="2.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="36" cy="34" r="1.5" fill="#6366f1" />
  <line x1="46" y1="34" x2="90" y2="34" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-linecap="round"/>
  
  <circle cx="28" cy="59" r="2.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="36" cy="59" r="1.5" fill="#6366f1" />
  <line x1="46" y1="59" x2="76" y2="59" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-linecap="round"/>
  
  <circle cx="28" cy="84" r="2.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="36" cy="84" r="1.5" fill="#6366f1" />
  <line x1="46" y1="84" x2="84" y2="84" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-linecap="round"/>
  <!-- Glowing Connection Overlays -->
  <path d="M 60,43 L 60,50 M 80,68 L 80,75 M 50,43 L 50,50 M 90,34 L 90,75" stroke="url(#violet-glow)" stroke-width="1" fill="none" stroke-dasharray="2 2" />
</svg>
