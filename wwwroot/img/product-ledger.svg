<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ledger-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Grid -->
  <g opacity="0.1">
    <line x1="10" y1="90" x2="110" y2="90" stroke="#ffffff" stroke-width="0.75" />
    <line x1="10" y1="70" x2="110" y2="70" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="10" y1="50" x2="110" y2="50" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="10" y1="30" x2="110" y2="30" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 2" />
  </g>
  <!-- Chart area glow -->
  <path d="M 20,90 L 20,55 L 40,65 L 60,40 L 80,45 L 100,25 L 100,90 Z" fill="url(#ledger-glow)" />
  <!-- Chart line -->
  <path d="M 20,55 L 40,65 L 60,40 L 80,45 L 100,25" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-emerald)"/>
  <!-- Chart nodes -->
  <circle cx="20" cy="55" r="3.5" fill="#0f0f12" stroke="#10b981" stroke-width="2" />
  <circle cx="60" cy="40" r="3.5" fill="#0f0f12" stroke="#10b981" stroke-width="2" />
  <circle cx="100" cy="25" r="4.5" fill="#10b981" filter="url(#glow-emerald)" />
  <circle cx="100" cy="25" r="1.5" fill="#ffffff" />
  <!-- Bar charts at bottom -->
  <rect x="25" y="78" width="8" height="12" rx="1" fill="#06b6d4" opacity="0.6"/>
  <rect x="45" y="72" width="8" height="18" rx="1" fill="#06b6d4" opacity="0.6"/>
  <rect x="65" y="82" width="8" height="8" rx="1" fill="#06b6d4" opacity="0.6"/>
  <rect x="85" y="68" width="8" height="22" rx="1" fill="#10b981" opacity="0.8"/>
</svg>
